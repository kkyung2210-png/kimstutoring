<section class="section home-cta-section consultation-section" id="consultation" aria-labelledby="consultation-title"><div class="container consultation-shell"><div class="consultation-heading"><p class="cta-kicker">무료 상담 신청</p><h2 id="consultation-title">나에게 맞는 수업,<br>무료 상담으로 시작해보세요.</h2><p>희망하는 수업과 현재 고민을 남겨주시면<br>확인 후 순차적으로 연락드리겠습니다.</p></div><form class="consultation-form-card" method="POST" name="consultation" data-netlify="true" netlify-honeypot="bot-field" action="/" data-consultation-form novalidate><input type="hidden" name="form-name" value="consultation"><input type="hidden" name="bot-field"><input type="hidden" name="sourcePage" value="/"><input type="hidden" name="submittedAt" value=""><div class="form-field"><label for="consultation-phone">연락처 <span class="required-mark" aria-hidden="true">*</span></label><input id="consultation-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required pattern="01[016789]-?[0-9]{3,4}-?[0-9]{4}" placeholder="연락받을 번호를 입력해 주세요" aria-describedby="consultation-phone-error"><p class="form-error" id="consultation-phone-error" data-error-for="phone" aria-live="polite"></p></div><div class="form-field"><label for="consultation-lesson">희망 수업 <span class="required-mark" aria-hidden="true">*</span></label><select id="consultation-lesson" name="lesson" required aria-describedby="consultation-lesson-error"><option value="">희망 수업을 선택해 주세요</option><option value="초등 영어">초등 영어</option><option value="초등 수학">초등 수학</option><option value="중등 영어">중등 영어</option><option value="중등 수학">중등 수학</option><option value="고등 영어">고등 영어</option><option value="고등 수학">고등 수학</option></select><p class="form-error" id="consultation-lesson-error" data-error-for="lesson" aria-live="polite"></p></div><div class="form-field"><label for="consultation-message">문의 내용 <span class="required-mark" aria-hidden="true">*</span></label><textarea id="consultation-message" name="message" required placeholder="현재 고민, 학습 목표, 희망하는 수업 내용을 간단히 적어주세요." aria-describedby="consultation-message-error"></textarea><p class="form-error" id="consultation-message-error" data-error-for="message" aria-live="polite"></p></div><div class="form-field privacy-field"><label class="privacy-label" for="consultation-privacy"><input id="consultation-privacy" name="privacyConsent" type="checkbox" value="동의" required aria-describedby="consultation-privacy-error"><span>상담 진행을 위해 연락처, 희망 수업, 문의 내용을 수집합니다.<br>수집된 정보는 상담 목적으로만 사용되며 내부 정책에 따라 파기됩니다.</span></label><p class="form-error" id="consultation-privacy-error" data-error-for="privacyConsent" aria-live="polite"></p></div><button class="button button-primary consultation-submit" type="submit" data-submit-button>무료 상담 신청하기</button><div class="form-status" data-form-status role="status" aria-live="polite" tabindex="-1"></div></form></div></section>
