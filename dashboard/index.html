<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index Intelligence Dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">킴스과외 · SEO Dashboard</p>
      <h1>Index Intelligence</h1>
    </div>
    <div class="header-actions">
      <span id="source-badge" class="source-badge">불러오는 중</span>
      <button id="reload-button" type="button">데이터 다시 불러오기</button>
    </div>
  </header>

  <main>
    <p id="source-notice" class="notice">Search Console 보고서를 준비하고 있습니다.</p>

    <section id="metric-grid" class="metric-grid" aria-label="Search Console 핵심 지표"></section>

    <section class="two-column">
      <article class="panel">
        <div class="panel-heading">
          <div><p class="eyebrow">Performance</p><h2>Top 20 Pages</h2></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>페이지</th><th>클릭</th><th>노출</th><th>CTR</th><th>순위</th></tr></thead>
            <tbody id="top-pages-body"></tbody>
          </table>
        </div>
      </article>

      <article class="panel">
        <div class="panel-heading">
          <div><p class="eyebrow">Queries</p><h2>Top 20 Queries</h2></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>검색어</th><th>클릭</th><th>노출</th><th>CTR</th><th>순위</th></tr></thead>
            <tbody id="top-queries-body"></tbody>
          </table>
        </div>
      </article>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div><p class="eyebrow">Coverage</p><h2>색인 문제</h2></div>
      </div>
      <div id="coverage-list" class="coverage-list"></div>
    </section>

    <section class="panel">
      <div class="panel-heading page-heading">
        <div>
          <p class="eyebrow">Page Detail</p>
          <h2>페이지별 Search Console 정보</h2>
          <span id="page-count" class="page-count"></span>
        </div>
        <div class="filters">
          <label>
            페이지 검색
            <input id="page-search" type="search" placeholder="제목, 지역, 과목, slug">
          </label>
          <label>
            색인 상태
            <select id="index-filter">
              <option value="all">전체</option>
              <option value="indexed">색인됨</option>
              <option value="not-indexed">확인 필요</option>
              <option value="unknown">미확인</option>
            </select>
          </label>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>페이지</th><th>색인</th><th>클릭</th><th>노출</th>
              <th>CTR</th><th>순위</th><th>마지막 크롤링</th>
            </tr>
          </thead>
          <tbody id="page-details-body"></tbody>
        </table>
      </div>
      <div class="pagination">
        <button id="previous-page" type="button">이전</button>
        <span id="page-position"></span>
        <button id="next-page" type="button">다음</button>
      </div>
    </section>
  </main>

  <footer>
    <span>조회 기간: <strong id="report-period">-</strong></span>
    <span>보고서 생성: <strong id="generated-at">-</strong></span>
  </footer>
  <p id="live-region" class="visually-hidden" aria-live="polite"></p>
  <script src="/dashboard.js" defer></script>
</body>
</html>
